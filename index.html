<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorting Visualizer</title>
<style>
  :root {
    --bg: #0b0e14;
    --panel: #141a26;
    --panel-2: #1b2333;
    --accent: #4f8cff;
    --accent-2: #7c4dff;
    --text: #e6ecff;
    --muted: #8b97ad;
    --bar: #3a4a6b;
    --compare: #ffd166;
    --swap: #ff5d73;
    --sorted: #06d6a0;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(1200px 700px at 20% -10%, #16203a 0%, var(--bg) 55%);
    color: var(--text);
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 28px 20px 60px; }
  header h1 {
    margin: 0 0 4px;
    font-size: 26px;
    letter-spacing: 0.3px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  header p { margin: 0 0 22px; color: var(--muted); font-size: 14px; }
  .grid { display: grid; grid-template-columns: 1fr 280px; gap: 18px; }
  @media (max-width: 900px){ .grid { grid-template-columns: 1fr; } }

  .card {
    background: linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
    border: 1px solid #232c40;
    border-radius: 16px;
    padding: 18px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.35);
  }

  .controls { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
  .algo-group { display: flex; flex-wrap: wrap; gap: 8px; }
  button, .seg button {
    cursor: pointer;
    border: 1px solid #2a3349;
    background: #1a2233;
    color: var(--text);
    padding: 9px 14px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    transition: transform .08s ease, background .2s ease, border-color .2s ease, box-shadow .2s ease;
  }
  button:hover { border-color: var(--accent); }
  button:active { transform: translateY(1px); }
  .seg button { background: transparent; }
  .seg button.active {
    background: linear-gradient(180deg, #22305a, #1a2540);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 0 0 1px var(--accent) inset;
  }
  .btn-primary {
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    border: none;
    padding: 10px 20px;
  }
  .btn-primary.paused { background: linear-gradient(90deg, #ff8a5c, #ff5d73); }
  .btn-ghost { background: #121826; }

  .slider { display: flex; flex-direction: column; gap: 6px; min-width: 180px; }
  .slider label { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }
  .slider label b { color: var(--text); }
  input[type=range] { -webkit-appearance: none; width: 100%; height: 6px; border-radius: 6px; background: #23304a; outline: none; }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
    background: var(--accent); cursor: pointer; box-shadow: 0 0 0 4px rgba(79,140,255,.18);
  }
  input[type=range]::-moz-range-thumb {
    width: 16px; height: 16px; border: 0; border-radius: 50%; background: var(--accent); cursor: pointer;
  }

  .stage {
    margin-top: 18px;
    background: #0a0e17;
    border: 1px solid #1c2436;
    border-radius: 14px;
    padding: 16px 14px 10px;
    height: 460px;
    position: relative;
    overflow: hidden;
  }
  .bars { display: flex; align-items: flex-end; justify-content: center; height: 100%; gap: 2px; }
  .bar {
    width: 100%;
    background: linear-gradient(180deg, var(--accent), #25407a);
    border-radius: 4px 4px 0 0;
    transition: height .18s ease, background .18s ease;
    min-height: 2px;
  }
  .bar.compare { background: linear-gradient(180deg, var(--compare), #b8862b); }
  .bar.swap { background: linear-gradient(180deg, var(--swap), #a5324a); }
  .bar.sorted { background: linear-gradient(180deg, var(--sorted), #048a66); }

  .legend { display: flex; gap: 16px; margin-top: 12px; flex-wrap: wrap; color: var(--muted); font-size: 12px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .dot.c-default { background: linear-gradient(180deg, var(--accent), #25407a); }
  .dot.c-compare { background: linear-gradient(180deg, var(--compare), #b8862b); }
  .dot.c-swap { background: linear-gradient(180deg, var(--swap), #a5324a); }
  .dot.c-sorted { background: linear-gradient(180deg, var(--sorted), #048a66); }

  .stats { display: flex; flex-direction: column; gap: 12px; }
  .stats h2 { margin: 0 0 6px; font-size: 15px; color: var(--text); }
  .stat {
    background: #10162a; border: 1px solid #1f2940; border-radius: 12px; padding: 12px 14px;
  }
  .stat .k { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }
  .stat .v { font-size: 24px; font-weight: 700; margin-top: 2px; }
  .stat .v small { font-size: 13px; color: var(--muted); font-weight: 500; }
  .status { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .pulse { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .pulse.running { background: var(--sorted); box-shadow: 0 0 10px var(--sorted); animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .35; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Real-Time Sorting Visualizer</h1>
    <p>Watch sorting algorithms work step-by-step. Adjust size and speed, then press Start.</p>
  </header>

  <div class="grid">
    <div class="card">
      <div class="controls">
        <div class="seg algo-group" id="algoGroup"></div>
        <button class="btn-primary" id="startBtn">Start</button>
        <button class="btn-ghost" id="resetBtn">Shuffle &amp; Reset</button>
        <div class="slider">
          <label>Array size <b id="sizeVal">50</b></label>
          <input type="range" id="sizeRange" min="10" max="200" value="50">
        </div>
        <div class="slider">
          <label>Speed <b id="speedVal">Normal</b></label>
          <input type="range" id="speedRange" min="0" max="100" value="45">
        </div>
      </div>

      <div class="stage"><div class="bars" id="bars"></div></div>

      <div class="legend">
        <span><i class="dot c-default"></i> Unsorted</span>
        <span><i class="dot c-compare"></i> Comparing</span>
        <span><i class="dot c-swap"></i> Swapping</span>
        <span><i class="dot c-sorted"></i> Sorted</span>
      </div>
    </div>

    <div class="card stats">
      <h2>Live Stats</h2>
      <div class="status"><span class="pulse" id="pulse"></span><span id="statusText">Ready</span></div>
      <div class="stat"><div class="k">Algorithm</div><div class="v" id="statAlgo">—</div></div>
      <div class="stat"><div class="k">Comparisons</div><div class="v" id="statCmp">0</div></div>
      <div class="stat"><div class="k">Swaps</div><div class="v" id="statSwap">0</div></div>
      <div class="stat"><div class="k">Time Elapsed</div><div class="v" id="statTime">0.0 <small>s</small></div></div>
    </div>
  </div>
</div>

<script>
(function () {
  const ALGOS = ["Bubble", "Insertion", "Selection", "Merge", "Quick", "Heap"];
  let current = "Bubble";
  let base = [];
  let arr = [];
  let stats = { comparisons: 0, swaps: 0 };
  let running = false;
  let paused = false;
  let stopFlag = false;
  let resume = null;
  let startTime = 0;
  let timer = null;

  const barsEl = document.getElementById("bars");
  const algoGroup = document.getElementById("algoGroup");
  const startBtn = document.getElementById("startBtn");
  const resetBtn = document.getElementById("resetBtn");
  const sizeRange = document.getElementById("sizeRange");
  const sizeVal = document.getElementById("sizeVal");
  const speedRange = document.getElementById("speedRange");
  const speedVal = document.getElementById("speedVal");
  const statAlgo = document.getElementById("statAlgo");
  const statCmp = document.getElementById("statCmp");
  const statSwap = document.getElementById("statSwap");
  const statTime = document.getElementById("statTime");
  const pulse = document.getElementById("pulse");
  const statusText = document.getElementById("statusText");

  ALGOS.forEach(name => {
    const b = document.createElement("button");
    b.textContent = name + " Sort";
    b.dataset.algo = name;
    if (name === current) b.classList.add("active");
    b.addEventListener("click", () => {
      if (running) return;
      current = name;
      [...algoGroup.children].forEach(c => c.classList.remove("active"));
      b.classList.add("active");
      statAlgo.textContent = name + " Sort";
      buildArray();
    });
    algoGroup.appendChild(b);
  });

  function delayForSpeed() {
    const v = Number(speedRange.value); // 0..100
    speedVal.textContent =
      v < 20 ? "Very slow" : v < 45 ? "Slow" : v < 70 ? "Normal" : v < 90 ? "Fast" : "Very fast";
    // map to ms between steps
    return Math.round(320 - v * 3.0);
  }

  function sleep(ms) {
    return new Promise(res => setTimeout(res, ms));
  }

  function buildArray() {
    const n = Number(sizeRange.value);
    sizeVal.textContent = n;
    base = [];
    for (let i = 0; i < n; i++) base.push(Math.floor(Math.random() * 95) + 5);
    arr = base.slice();
    stats = { comparisons: 0, swaps: 0 };
    updateStats();
    render([]);
  }

  function render() {
    const max = Math.max(...arr);
    barsEl.innerHTML = "";
    for (let i = 0; i < arr.length; i++) {
      const bar = document.createElement("div");
      bar.className = "bar";
      const h = (arr[i] / max) * 410;
      bar.style.height = h + "px";
      barsEl.appendChild(bar);
    }
  }

  function renderWithHighlights(hl) {
    const max = Math.max(...arr);
    const children = barsEl.children;
    for (let i = 0; i < arr.length; i++) {
      const bar = children[i];
      const h = (arr[i] / max) * 410;
      bar.style.height = h + "px";
      bar.className = "bar" + (hl.sorted ? " sorted" : "") +
        (hl.compare && hl.compare.has(i) ? " compare" : "") +
        (hl.swap && hl.swap.has(i) ? " swap" : "");
    }
  }

  function updateStats() {
    statCmp.textContent = stats.comparisons;
    statSwap.textContent = stats.swaps;
  }

  function updateStatsTime() {
    const secs = ((performance.now() - startTime) / 1000).toFixed(1);
    statTime.innerHTML = secs + ' <small>s</small>';
  }

  function setStatus(state, text) {
    pulse.classList.toggle("running", state === "running");
    statusText.textContent = text;
  }

  // Generator step interface: yields {hl:{sorted:Set, compare:Set, swap:Set}}
  async function runSort() {
    stopFlag = false;
    paused = false;
    running = true;
    startBtn.textContent = "Pause";
    startBtn.classList.add("paused");
    setStatus("running", "Sorting…");
    startTime = performance.now();

    const sorted = new Set();
    const makeCtx = () => ({
      sorted,
      cmp() { stats.comparisons++; },
      swap(i, j) {
        stats.swaps++;
        const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
      },
      step() {
        return (async function () {
          const gen = curGen;
          while (true) {
            const { value, done } = gen.next();
            if (done) break;
            const hl = value.hl;
            renderWithHighlights(hl);
            updateStats();
            updateStatsTime();
            await stepSleep();
            if (stopFlag) return false;
          }
          return true;
        })();
      }
    });

    const ctx = makeCtx();
    const ok = await ctx.step();

    // finish
    for (let i = 0; i < arr.length; i++) sorted.add(i);
    renderWithHighlights({ sorted, compare: null, swap: null });
    updateStats();

    if (!stopFlag) {
      setStatus("running", "Done!");
    } else {
      setStatus("idle", "Paused");
    }
    running = false;
    startBtn.textContent = "Start";
    startBtn.classList.remove("paused");
  }

  let factory = null;
  let curGen = null;

  async function stepSleep() {
    const ms = delayForSpeed();
    const start = performance.now();
    while (true) {
      if (stopFlag) return;
      if (paused) {
        if (!resume) resume = new Promise(r => (r0 = r));
        await resume;
        resume = null;
      }
      if (performance.now() - start >= ms) return;
      await sleep(Math.min(20, ms));
    }
  }
  let r0 = null;

  startBtn.addEventListener("click", async () => {
    if (paused) {
      // resume
      paused = false;
      startBtn.textContent = "Pause";
      setStatus("running", "Sorting…");
      if (r0) { const r = r0; r0 = null; resume = null; r(); }
    } else if (!running) {
      // start
      if (!factory) factory = makeFactory(current);
      curGen = factory();
      arr = base.slice();
      stats = { comparisons: 0, swaps: 0 };
      updateStats();
      await runSort();
    } else {
      // pause
      paused = true;
      startBtn.textContent = "Resume";
      setStatus("idle", "Paused");
    }
  });

  resetBtn.addEventListener("click", () => {
    stopFlag = true;
    paused = false;
    if (r0) { const r = r0; r0 = null; resume = null; r(); }
    setTimeout(() => {
      factory = null;
      curGen = null;
      paused = false;
      running = false;
      startBtn.textContent = "Start";
      startBtn.classList.remove("paused");
      buildArray();
      statAlgo.textContent = current + " Sort";
      setStatus("idle", "Ready");
    }, 30);
  });

  sizeRange.addEventListener("input", () => {
    if (running) return;
    buildArray();
  });
  speedRange.addEventListener("input", delayForSpeed);

  // ---- Algorithms ----
  function makeFactory(name) {
    return function () {
      switch (name) {
        case "Bubble": return bubbleSort();
        case "Insertion": return insertionSort();
        case "Selection": return selectionSort();
        case "Merge": return mergeSort(0, arr.length - 1);
        case "Quick": return quickSort(0, arr.length - 1);
        case "Heap": return heapSort();
      }
    };
  }

  function* bubbleSort() {
    const n = arr.length;
    for (let i = 0; i < n - 1; i++) {
      for (let j = 0; j < n - i - 1; j++) {
        stats.comparisons++;
        yield { hl: { sorted: null, compare: new Set([j, j + 1]), swap: null } };
        if (arr[j] > arr[j + 1]) {
          stats.swaps++;
          const t = arr[j]; arr[j] = arr[j + 1]; arr[j + 1] = t;
          yield { hl: { sorted: null, compare: null, swap: new Set([j, j + 1]) } };
        }
      }
    }
  }

  function* insertionSort() {
    const n = arr.length;
    for (let i = 1; i < n; i++) {
      let j = i;
      const key = arr[j];
      while (j > 0 && arr[j - 1] > key) {
        stats.comparisons++;
        yield { hl: { sorted: null, compare: new Set([j - 1, j]), swap: null } };
        arr[j] = arr[j - 1];
        stats.swaps++;
        yield { hl: { sorted: null, compare: null, swap: new Set([j]) } };
        j--;
      }
      stats.comparisons++;
      arr[j] = key;
    }
  }

  function* selectionSort() {
    const n = arr.length;
    for (let i = 0; i < n - 1; i++) {
      let min = i;
      for (let j = i + 1; j < n; j++) {
        stats.comparisons++;
        yield { hl: { sorted: null, compare: new Set([min, j]), swap: null } };
        if (arr[j] < arr[min]) min = j;
      }
      if (min !== i) {
        stats.swaps++;
        const t = arr[i]; arr[i] = arr[min]; arr[min] = t;
        yield { hl: { sorted: null, compare: null, swap: new Set([i, min]) } };
      }
    }
  }

  function* mergeSort(l, r) {
    if (l >= r) return;
    const mid = (l + r) >> 1;
    yield* mergeSort(l, mid);
    yield* mergeSort(mid + 1, r);
    yield* merge(l, mid, r);
  }

  function* merge(l, mid, r) {
    const left = arr.slice(l, mid + 1);
    const right = arr.slice(mid + 1, r + 1);
    let i = 0, j = 0, k = l;
    while (i < left.length && j < right.length) {
      stats.comparisons++;
      yield { hl: { sorted: null, compare: new Set([l + i, mid + 1 + j]), swap: null } };
      if (left[i] <= right[j]) { arr[k] = left[i]; i++; }
      else { arr[k] = right[j]; j++; }
      stats.swaps++;
      yield { hl: { sorted: null, compare: null, swap: new Set([k]) } };
      k++;
    }
    while (i < left.length) { arr[k] = left[i]; stats.swaps++;
      yield { hl: { sorted: null, compare: null, swap: new Set([k]) } }; i++; k++; }
    while (j < right.length) { arr[k] = right[j]; stats.swaps++;
      yield { hl: { sorted: null, compare: null, swap: new Set([k]) } }; j++; k++; }
  }

  function* quickSort(l, r) {
    if (l >= r) return;
    const pi = yield* partition(l, r);
    yield* quickSort(l, pi - 1);
    yield* quickSort(pi + 1, r);
  }

  function* partition(l, r) {
    const pivot = arr[r];
    let i = l - 1;
    for (let j = l; j < r; j++) {
      stats.comparisons++;
      yield { hl: { sorted: null, compare: new Set([j, r]), swap: null } };
      if (arr[j] < pivot) {
        i++;
        stats.swaps++;
        const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
        yield { hl: { sorted: null, compare: null, swap: new Set([i, j]) } };
      }
    }
    stats.swaps++;
    const t = arr[i + 1]; arr[i + 1] = arr[r]; arr[r] = t;
    yield { hl: { sorted: null, compare: null, swap: new Set([i + 1, r]) } };
    return i + 1;
  }

  function* heapSort() {
    const n = arr.length;
    for (let i = n >> 1; i >= 0; i--) yield* heapify(n, i);
    for (let i = n - 1; i > 0; i--) {
      stats.swaps++;
      const t = arr[0]; arr[0] = arr[i]; arr[i] = t;
      yield { hl: { sorted: null, compare: null, swap: new Set([0, i]) } };
      yield* heapify(i, 0);
    }
  }

  function* heapify(n, i) {
    while (true) {
      let largest = i;
      const l = 2 * i + 1, r = 2 * i + 2;
      if (l < n) { stats.comparisons++; if (arr[l] > arr[largest]) largest = l; }
      if (r < n) { stats.comparisons++; if (arr[r] > arr[largest]) largest = r; }
      if (largest === i) break;
      yield { hl: { sorted: null, compare: new Set([i, largest]), swap: null } };
      stats.swaps++;
      const t = arr[i]; arr[i] = arr[largest]; arr[largest] = t;
      yield { hl: { sorted: null, compare: null, swap: new Set([i, largest]) } };
      i = largest;
    }
  }

  buildArray();
  statAlgo.textContent = current + " Sort";
})();
</script>
</body>
</html>
